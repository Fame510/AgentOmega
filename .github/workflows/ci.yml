name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Playwright's Python package installs fine; browser binaries are not
          # needed for lint/import/unit tests, so we skip `playwright install`.
          pip install -r requirements.txt
          pip install ruff pytest

      - name: Lint (ruff)
        run: |
          # Fail on real errors (syntax, undefined names, etc.); treat the rest
          # as non-blocking style warnings so CI is actionable, not noisy.
          ruff check --output-format=github --select E9,F63,F7,F82 .
          ruff check --output-format=github --exit-zero .

      - name: Run tests (pytest)
        run: pytest -q
